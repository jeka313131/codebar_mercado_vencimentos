services:
  backend:
    build: ./backend
    container_name: giro-rapido-backend
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173,https://localhost:8443
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_TLS_INSECURE: ${EVOLUTION_TLS_INSECURE:-}
      VPS_IMAGE_BASE_URL: ${VPS_IMAGE_BASE_URL:-}
      VPS_IMAGE_UPLOAD_URL: ${VPS_IMAGE_UPLOAD_URL:-}
      VPS_IMAGE_UPLOAD_TOKEN: ${VPS_IMAGE_UPLOAD_TOKEN:-}
      VPS_IMAGE_TLS_INSECURE: ${VPS_IMAGE_TLS_INSECURE:-}
      ENABLE_ALERT_CRON: ${ENABLE_ALERT_CRON:-true}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: giro-rapido-frontend
    ports:
      - "5173:80"
      - "8443:443"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  backend-data:
