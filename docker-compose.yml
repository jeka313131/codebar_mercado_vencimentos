services:
  backend:
    build: ./backend
    container_name: giro-rapido-backend
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173,https://localhost:8443
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    container_name: giro-rapido-frontend
    ports:
      - "5173:80"
      - "8443:443"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  backend-data:
