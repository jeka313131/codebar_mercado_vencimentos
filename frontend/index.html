<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#2b4a72" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Mercado Giro Rápido</title>
  </head>
  <body>
    <div id="app"></div>

    <section id="scanner-panel" class="scanner-panel" aria-hidden="true">
      <div class="scanner-header">
        <h2>Aponte para o código</h2>
      </div>
      <p id="scanner-status" class="scanner-status">Iniciando câmera…</p>
      <div class="scanner-viewport">
        <video id="camera-video" playsinline webkit-playsinline muted autoplay></video>
        <div class="scan-frame" id="scan-frame" aria-hidden="true"></div>
        <div class="scanner-controls">
          <button
            type="button"
            id="btn-cancel-scanner"
            class="scanner-fab scanner-fab--cancel"
            aria-label="Cancelar leitura"
          >
            ✕
          </button>
          <button type="button" id="btn-type-barcode" class="scanner-btn-type">
            Digitar código
          </button>
          <button
            type="button"
            id="btn-torch"
            class="scanner-fab scanner-fab--torch"
            aria-label="Ligar lanterna"
            aria-pressed="false"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"
              />
            </svg>
          </button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
